version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: bonk
    main: ./cmd/bonk
    binary: bonk
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}}

universal_binaries:
  - id: bonk-universal
    replace: true
    name_template: bonk

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: bonk-project
    name: bonk
